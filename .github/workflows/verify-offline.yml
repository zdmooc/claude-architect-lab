name: Verify offline labs

on:
  push:
    branches: ["main", "feature/**", "docs/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python labs
        run: python -m compileall -q labs
      - name: Run offline policy, tools and invoice tests
        run: python -m pytest -q tests
      - name: Run code-review lab tests
        run: PYTHONPATH=labs/labo2_claude_code python -m pytest -q labs/labo2_claude_code/tests

# Tests d'intégration API / MCP / Agent SDK volontairement exclus :
# pas de secrets ni de dépense API sur les PR. Exécuter dans un environnement contrôlé.
